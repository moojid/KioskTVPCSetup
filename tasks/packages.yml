---
- name: Install git
  become: true
  package:
    name: git

- name: Install nano
  become: true
  package:
    name: nano

- name: Install curl
  become: true
  package:
    name: curl

- name: Install cron
  become: true
  package:
    name: cron

- name: Install Xserver packages
  become: true
  package:
    pkg:
      - xserver-xorg
      - x11-xserver-utils
      - xinit
      - openbox

- name: Install chromium
  become: true
  package:
    name: chromium

- name: Install networking tools
  become: true
  package:
    pkg:
      - net-tools
      - nmap
      - miniupnpc
      - speedtest
      - avahi-daemon
      - avahi-utils
      - wget
      - systemd-timesyncd
      - tcpdump
      - network-manager
      - arp-scan
      - ethtool
      - lldpd

- name: Deploy IEEE OUI database for arp-scan
  become: true
  copy:
    src: ieee-oui.txt
    dest: /usr/share/arp-scan/ieee-oui.txt
    owner: root
    group: root
    mode: '0644'
    backup: true

- name: Install packages for music setup
  become: true
  package:
    pkg:
      - bluez
      - pulseaudio-module-bluetooth
      - pianobar
      - npm
      - tmux
