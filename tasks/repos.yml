---
- name: Configure Ookla repository
  become: true
  block:
    - name: Ensure CA certificates are installed
      ansible.builtin.apt:
        name: ca-certificates
        state: present

    - name: Create APT keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download Ookla signing key
      ansible.builtin.get_url:
        url: https://packagecloud.io/ookla/speedtest-cli/gpgkey
        dest: /etc/apt/keyrings/ookla-speedtest.asc
        owner: root
        group: root
        mode: "0644"
        force: true

    - name: Remove previous Ookla repository entry
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/trusted.gpg.d/ookla_speedtest-cli-archive-keyring.gpg] https://packagecloud.io/ookla/speedtest-cli/debian bullseye main"
        state: absent
        update_cache: false

    - name: Add Ookla repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/ookla-speedtest.asc] https://packagecloud.io/ookla/speedtest-cli/debian bullseye main"
        filename: ookla-speedtest
        state: present
        update_cache: false

    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true