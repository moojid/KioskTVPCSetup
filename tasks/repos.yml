---
- name: Configure Ookla repository
  become: true
  block:
    - name: Ensure CA certificates are installed
      ansible.builtin.apt:
        name: ca-certificates
        state: present

    - name: Create APT keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download Ookla signing key
      ansible.builtin.get_url:
        url: https://packagecloud.io/ookla/speedtest-cli/gpgkey
        dest: /etc/apt/keyrings/ookla-speedtest.asc
        owner: root
        group: root
        mode: "0644"
        force: true

    # - name: Remove previous Ookla repository entry
    #   ansible.builtin.apt_repository:
    #     repo: "deb [signed-by=/etc/apt/trusted.gpg.d/ookla_speedtest-cli-archive-keyring.gpg] https://packagecloud.io/ookla/speedtest-cli/debian bullseye main"
    #     state: absent
    #     update_cache: false

    - name: Add Ookla repository via plain text file
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/ookla-speedtest.sources
        content: |
          Types: deb
          URIs: https://packagecloud.io/ookla/speedtest-cli/debian/
          Suites: bullseye
          Components: main
          Signed-By: /etc/apt/keyrings/ookla-speedtest.asc
        mode: '0644'
        
    - name: Fix apt sources for EOL Debian 11
      when: ansible_facts['distribution'] == "Debian" and ansible_facts['distribution_major_version'] == "11"
      become: true
      block:
        - name: Point bullseye at archive.debian.org
          ansible.builtin.copy:
            dest: /etc/apt/sources.list
            content: |
              deb http://archive.debian.org/debian bullseye main
              deb http://archive.debian.org/debian-security bullseye-security main
            mode: "0644"

        - name: Don't fail on expired Release files
          ansible.builtin.copy:
            dest: /etc/apt/apt.conf.d/99archive
            content: 'Acquire::Check-Valid-Until "false";'
            mode: "0644"

    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true