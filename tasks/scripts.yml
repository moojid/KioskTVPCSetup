---
- name: Create bash profile
  copy:
    dest: "~/.bash_profile"
    src: bash_profile
- name: create pnp.sh
  copy:
    dest: "~/pnp.sh"
    mode: 0744
    src: pnp.sh

- name: create tm.sh
  copy:
    dest: "~/tm.sh"
    mode: 0744
    src: tm.sh
- name: create kuma.sh
  copy:
    dest: "~/kuma.sh"
    mode: 0744
    src: kuma.sh
- name: Add pnp.sh to cron
  cron:
    name: "ping back"
    minute: "0"
    job: ". ~/.env; ~/pnp.sh >/dev/null 2>&1"

- name: create n.sh
  copy:
    dest: "~/n.sh"
    mode: 0744
    src: n.sh

- name: Create restart-chrome script
  copy:
    dest: "~/restart-chrome.sh"
    src: restart-chrome.sh
    mode: '0755'

- name: Install network diagnostics command
  become: true
  copy:
    dest: /usr/local/bin/m
    src: m.sh
    owner: root
    group: root
    mode: '0755'

- name: Allow the Ansible user to run network diagnostics without a password
  become: true
  copy:
    dest: /etc/sudoers.d/m
    content: "{{ ansible_user }} ALL=(root) NOPASSWD: /usr/local/bin/m\n"
    owner: root
    group: root
    mode: '0440'
    validate: '/usr/sbin/visudo -cf %s'

- name: Add kuma.sh to cron
  cron:
    name: "ping kuma"
    job: ". ~/.env; ~/kuma.sh >/dev/null 2>&1"
